<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarembok VE // Edge Audio & Voice Gateway</title>
    <style>
        :root {
            --bg-base: #05070a;
            --bg-panel: #0b111e;
            --bg-card: #111a2d;
            --border-neon: #1e293b;
            --glow-cyan: #00f0ff;
            --glow-green: #10b981;
            --glow-amber: #f59e0b;
            --glow-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-mono: 'SFMono-Regular', Consolas, 'Fira Code', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 50% 20%, #0d1a33 0%, var(--bg-base) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .header-brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-neon);
        }

        .brand-title {
            font-family: var(--font-mono);
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            color: var(--glow-cyan);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid #334155;
            background: rgba(30, 41, 59, 0.6);
            color: var(--text-muted);
        }
        .status-badge.online {
            border-color: var(--glow-green);
            color: var(--glow-green);
            background: rgba(16, 185, 129, 0.1);
        }
        .status-badge.active {
            border-color: var(--glow-cyan);
            color: var(--glow-cyan);
            background: rgba(0, 240, 255, 0.15);
            animation: pulseGlow 1.5s infinite alternate;
        }

        @keyframes pulseGlow {
            from { box-shadow: 0 0 4px var(--glow-cyan); }
            to { box-shadow: 0 0 14px var(--glow-cyan); }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* Meter styling */
        .meter-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .meter-meta {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .meter-container {
            background: #1e293b;
            height: 18px;
            border-radius: 9px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .meter-threshold-line {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%; /* Maps to approx -30dB */
            width: 2px;
            background: var(--glow-amber);
            z-index: 2;
            box-shadow: 0 0 6px var(--glow-amber);
        }

        .meter-bar {
            background: linear-gradient(90deg, #10b981 0%, #38bdf8 70%, #ef4444 100%);
            width: 0%;
            height: 100%;
            border-radius: 9px;
            transition: width 0.05s ease;
        }

        .meter-bar.interrupted {
            background: var(--glow-red) !important;
            box-shadow: 0 0 12px var(--glow-red);
        }

        /* Controls */
        .btn-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
        }

        button {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-primary {
            background: #0284c7;
            color: #ffffff;
        }
        .btn-primary:hover {
            background: #0369a1;
            box-shadow: 0 0 12px rgba(2, 132, 199, 0.4);
        }

        .btn-secondary {
            background: #1e293b;
            color: #e2e8f0;
            border-color: #334155;
        }
        .btn-secondary:hover {
            background: #334155;
            color: #ffffff;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
        }
        .btn-danger:hover {
            background: #ef4444;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        /* Config inputs */
        .config-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        input[type="text"], input[type="range"] {
            background: #0b111e;
            border: 1px solid #334155;
            color: #f8fafc;
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }

        /* Log console */
        .console-log {
            background: #05070a;
            border: 1px solid var(--border-neon);
            border-radius: 8px;
            padding: 0.75rem;
            max-height: 160px;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: #94a3b8;
            display: flex;
            flex-direction: column-reverse;
            gap: 4px;
        }

        .log-entry {
            line-height: 1.4;
        }
        .log-entry.warn { color: var(--glow-amber); }
        .log-entry.crit { color: var(--glow-red); }
        .log-entry.info { color: #38bdf8; }
        .log-entry.success { color: var(--glow-green); }
    </style>
</head>
<body>

<div class="container">
    <div class="header-brand">
        <div class="brand-title">
            <span style="font-size: 1.2rem;">🎙️</span> SAREMBOK VE // VOICE ENGINE
        </div>
        <div id="wsBadge" class="status-badge">GATEWAY: OFFLINE</div>
    </div>

    <!-- MAIN AUDIO GATEWAY CARD -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">Edge Audio Gateway & Barge-In VAD</div>
            <div id="agentStateBadge" class="status-badge">ENGINE: IDLE</div>
        </div>

        <div class="config-row">
            <label for="wsUrl" style="min-width: 90px;">WebSocket:</label>
            <input type="text" id="wsUrl" value="ws://localhost:8765" style="flex-grow: 1;">
            <button id="connectBtn" class="btn-primary" style="padding: 0.4rem 0.8rem;">Connect</button>
        </div>

        <div class="meter-wrapper">
            <div class="meter-meta">
                <span id="micLabel">Microphone: Standing by...</span>
                <span id="dbReadout">-&infin; dB</span>
            </div>
            <div class="meter-container">
                <div class="meter-threshold-line" title="Interrupt Threshold (-30dB)"></div>
                <div id="volMeter" class="meter-bar"></div>
            </div>
        </div>

        <div class="config-row">
            <label for="thresholdSlider" style="min-width: 140px;">VAD Threshold: <span id="threshVal">-30</span> dB</label>
            <input type="range" id="thresholdSlider" min="-60" max="-10" value="-30" style="flex-grow: 1;">
        </div>

        <div class="btn-group">
            <button id="queueAriaBtn" class="btn-secondary">
                <span>🤖</span> Queue ARIA Turn
            </button>
            <button id="queueAnalystBtn" class="btn-secondary">
                <span>📊</span> Queue Analyst Turn
            </button>
            <button id="interruptBtn" class="btn-danger">
                <span>⚡</span> Force Interrupt
            </button>
        </div>
    </div>

    <!-- TRANSACTION / EVENT LOG -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">Live State Ledger & Event Stream</div>
            <button id="clearLogBtn" class="btn-secondary" style="padding: 2px 8px; font-size: 0.7rem;">Clear Log</button>
        </div>
        <div id="eventLog" class="console-log">
            <div class="log-entry info">[SYSTEM] Sarembok Edge Audio Gateway initialized. Ready to connect.</div>
        </div>
    </div>
</div>

<script>
class AudioBridge {
    constructor() {
        this.socket = null;
        this.audioContext = null;
        this.analyser = null;
        this.micStream = null;

        this.volumeThreshold = -30;
        this.cooldownPeriod = 1500;
        this.lastInterruptTime = 0;
        this.isMonitoring = false;
    }

    init() {
        this.bindEvents();
    }

    log(msg, type = "info") {
        const logBox = document.getElementById("eventLog");
        const entry = document.createElement("div");
        entry.className = `log-entry ${type}`;
        const time = new Date().toLocaleTimeString();
        entry.innerText = `[${time}] ${msg}`;
        logBox.insertBefore(entry, logBox.firstChild);
    }

    bindEvents() {
        document.getElementById("connectBtn").addEventListener("click", async () => {
            await this.connectWebSocket();
            await this.initializeMicrophone();
        });

        document.getElementById("thresholdSlider").addEventListener("input", (e) => {
            this.volumeThreshold = parseFloat(e.target.value);
            document.getElementById("threshVal").innerText = this.volumeThreshold;
            // Update visual threshold marker (mapping -60..0dB to 0..100%)
            const markerPos = Math.min(100, Math.max(0, (this.volumeThreshold + 60) * 1.66));
            document.querySelector(".meter-threshold-line").style.left = `${markerPos}%`;
        });

        document.getElementById("queueAriaBtn").addEventListener("click", () => {
            this.sendTurn("ARIA_Orchestrator", "Data ingestion anomaly resolved across distributed edge blocks.", "en-US-Studio-O");
        });

        document.getElementById("queueAnalystBtn").addEventListener("click", () => {
            this.sendTurn("Worker_03_Analyst", "Ledger integrity confirmed. SQLite-WAL sync complete.", "en-US-Studio-Q");
        });

        document.getElementById("interruptBtn").addEventListener("click", () => {
            this.executeInterrupt("Manual Operator Override");
        });

        document.getElementById("clearLogBtn").addEventListener("click", () => {
            document.getElementById("eventLog").innerHTML = "";
        });
    }

    async connectWebSocket() {
        const url = document.getElementById("wsUrl").value.trim();
        this.log(`Connecting to voice gateway: ${url}...`, "info");

        try {
            this.socket = new WebSocket(url);

            this.socket.onopen = () => {
                const badge = document.getElementById("wsBadge");
                badge.innerText = "GATEWAY: ONLINE";
                badge.className = "status-badge online";
                this.log("Connected to Sarembok Voice Gateway.", "success");
            };

            this.socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    this.handleGatewayMessage(data);
                } catch (e) {
                    this.log(`Raw socket message: ${event.data}`, "info");
                }
            };

            this.socket.onclose = () => {
                const badge = document.getElementById("wsBadge");
                badge.innerText = "GATEWAY: DISCONNECTED";
                badge.className = "status-badge";
                this.log("Gateway connection dropped.", "warn");
            };

            this.socket.onerror = (err) => {
                this.log("WebSocket transport fault.", "crit");
            };
        } catch (err) {
            this.log(`Connection failed: ${err.message}`, "crit");
        }
    }

    handleGatewayMessage(data) {
        if (data.type === "AGENT_STATE_UPDATE") {
            const badge = document.getElementById("agentStateBadge");
            badge.innerText = `ENGINE: ${data.state} (${data.agent_id})`;
            if (data.state === "PLAYING") {
                badge.className = "status-badge active";
            } else if (data.state === "INTERRUPTED") {
                badge.className = "status-badge";
                badge.style.color = "#ef4444";
                badge.style.borderColor = "#ef4444";
            } else {
                badge.className = "status-badge";
                badge.style.color = "";
                badge.style.borderColor = "";
            }
            this.log(`Agent [${data.agent_id}] -> ${data.state} (Turn: ${data.turn_id})`, data.state === "INTERRUPTED" ? "crit" : "info");
        } else if (data.type === "INTERRUPT_ACK") {
            this.log(`Interrupt ACK acknowledged by gateway. Active turn: ${data.active_turn || 'None'}`, "warn");
        } else if (data.type === "QUEUE_ACK") {
            this.log(`Turn ${data.turn_id} committed to schedule queue (Depth: ${data.queue_size})`, "success");
        }
    }

    sendTurn(agentId, text, voiceModel) {
        if (this.socket && this.socket.readyState === WebSocket.OPEN) {
            const turnId = "turn_" + Date.now().toString(36);
            this.socket.send(JSON.stringify({
                command: "QUEUE_TURN",
                turn_id: turnId,
                agent_id: agentId,
                text: text,
                voice_model: voiceModel
            }));
            // Also trigger loop start
            this.socket.send(JSON.stringify({ command: "START_ORCHESTRATION" }));
        } else {
            this.log("Cannot queue turn: WebSocket disconnected.", "warn");
        }
    }

    async initializeMicrophone() {
        try {
            this.micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = this.audioContext.createMediaStreamSource(this.micStream);
            this.analyser = this.audioContext.createAnalyser();
            this.analyser.fftSize = 256;
            source.connect(this.analyser);

            document.getElementById("micLabel").innerText = "Microphone: Live (Listening for voice activity)";
            document.getElementById("micLabel").style.color = "#10b981";
            this.log("Microphone hardware stream mounted successfully.", "success");

            if (!this.isMonitoring) {
                this.isMonitoring = true;
                this.monitorVoiceLevel();
            }
        } catch (err) {
            this.log(`Microphone access error: ${err.message}`, "crit");
            document.getElementById("micLabel").innerText = "Microphone: Access Denied / Inactive";
            document.getElementById("micLabel").style.color = "#ef4444";
        }
    }

    monitorVoiceLevel() {
        const bufferLength = this.analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        const checkVolume = () => {
            this.analyser.getByteFrequencyData(dataArray);

            // Compute RMS amplitude
            let sumSquares = 0;
            for (let i = 0; i < bufferLength; i++) {
                sumSquares += dataArray[i] * dataArray[i];
            }
            const rms = Math.sqrt(sumSquares / bufferLength);

            // Convert to decibels (-Infinity to 0 dB)
            const db = rms > 0 ? 20 * Math.log10(rms / 255) : -99;
            const displayDb = db > -99 ? db.toFixed(1) + " dB" : "-∞ dB";
            document.getElementById("dbReadout").innerText = displayDb;

            // Map visual width (assuming -60dB min to 0dB max)
            const visualWidth = Math.min(100, Math.max(0, (db + 60) * 1.66));
            document.getElementById("volMeter").style.width = `${visualWidth}%`;

            // Voice Activity Detection Check
            if (db > this.volumeThreshold) {
                const now = Date.now();
                if (now - this.lastInterruptTime > this.cooldownPeriod) {
                    this.executeInterrupt(`VAD trigger (${displayDb} > ${this.volumeThreshold}dB)`);
                    this.lastInterruptTime = now;
                }
            }

            requestAnimationFrame(checkVolume);
        };

        requestAnimationFrame(checkVolume);
    }

    executeInterrupt(reason = "VAD Detection") {
        if (this.socket && this.socket.readyState === WebSocket.OPEN) {
            this.log(`[BARGE-IN] ${reason} firing INTERRUPT to gateway!`, "crit");
            this.socket.send(JSON.stringify({ command: "INTERRUPTED" }));

            // Visual UI blink indicator
            const bar = document.getElementById("volMeter");
            bar.classList.add("interrupted");
            setTimeout(() => bar.classList.remove("interrupted"), 400);
        }
    }
}

const bridge = new AudioBridge();
window.addEventListener("DOMContentLoaded", () => bridge.init());
</script>

</body>
</html>
