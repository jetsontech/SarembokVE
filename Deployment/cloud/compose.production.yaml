services:
  sarembok-runtime:
    ports: !reset []
    environment:
      SAREMBOK_AUTH_TOKEN: ${SAREMBOK_AUTH_TOKEN:-}
      # Intelligence Provider Interface
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      SAREMBOK_GEMINI_API: ${SAREMBOK_GEMINI_API:-interactions}
      SAREMBOK_GEMINI_THINKING_LEVEL: ${SAREMBOK_GEMINI_THINKING_LEVEL:-low}
      SAREMBOK_PROVIDER_ORDER: ${SAREMBOK_PROVIDER_ORDER:-Gemini,OpenRouter,Groq,OpenAI,Custom}
      LLM_ENDPOINT_URL: ${LLM_ENDPOINT_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-120b}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      SAREMBOK_LLM_MAX_OUTPUT_TOKENS: ${SAREMBOK_LLM_MAX_OUTPUT_TOKENS:-800}


  sarembok-edge:
    build:
      context: ./edge
      dockerfile: Dockerfile
    image: sarembok-edge:production
    container_name: sarembok-edge
    restart: unless-stopped
    depends_on:
      sarembok-runtime:
        condition: service_healthy
    environment:
      SAREMBOK_SITE_ADDRESS: ${SAREMBOK_PUBLIC_HOST:-${SAREMBOK_SITE_ADDRESS:-sarembok.com}}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}

    ports:
      - "80:80"
      - "443:443"
    volumes:
      - sarembok-caddy-data:/data
      - sarembok-caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  sarembok-caddy-data:
  sarembok-caddy-config:
