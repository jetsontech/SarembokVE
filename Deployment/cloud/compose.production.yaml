services:
  sarembok-runtime:
    ports: !reset []
    environment:
      SAREMBOK_AUTH_TOKEN: ${SAREMBOK_AUTH_TOKEN:-}
      # Intelligence Provider Interface
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      SAREMBOK_GEMINI_API: ${SAREMBOK_GEMINI_API:-generatecontent}
      SAREMBOK_GEMINI_THINKING_LEVEL: ${SAREMBOK_GEMINI_THINKING_LEVEL:-low}
      SAREMBOK_PROVIDER_ORDER: ${SAREMBOK_PROVIDER_ORDER:-OpenRouter,Groq,Gemini,OpenAI,Custom}
      LLM_ENDPOINT_URL: ${LLM_ENDPOINT_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      SAREMBOK_LLM_PROVIDER_TIMEOUT_SECONDS: ${SAREMBOK_LLM_PROVIDER_TIMEOUT_SECONDS:-25}
      SAREMBOK_LLM_TOTAL_TIMEOUT_SECONDS: ${SAREMBOK_LLM_TOTAL_TIMEOUT_SECONDS:-35}
      SAREMBOK_LLM_MAX_OUTPUT_TOKENS: ${SAREMBOK_LLM_MAX_OUTPUT_TOKENS:-350}
    volumes:
      - sarembok-data:/data
      - ./server.py:/app/server.py:ro
      - ./knowledge_rpc_server.py:/app/knowledge_rpc_server.py:ro
      - ./runtime_response_composer.py:/app/runtime_response_composer.py:ro
      - ./runtime_authority.py:/app/runtime_authority.py:ro
      - ./capability_registry.py:/app/capability_registry.py:ro
      - ./provider_router.py:/app/provider_router.py:ro
      - ../../frontend:/app/frontend:ro

  sarembok-browser:
    image: sarembok-browser:production

  sarembok-edge:
    build:
      context: ./edge
      dockerfile: Dockerfile
    image: sarembok-edge:production
    container_name: sarembok-edge
    restart: unless-stopped
    depends_on:
      sarembok-runtime:
        condition: service_healthy
    environment:
      SAREMBOK_SITE_ADDRESS: ${SAREMBOK_PUBLIC_HOST:-${SAREMBOK_SITE_ADDRESS:-sarembok.com}}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}

    ports:
      - "80:80"
      - "443:443"
    volumes:
      - sarembok-caddy-data:/data
      - sarembok-caddy-config:/config
      - ../../frontend:/srv:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  sarembok-caddy-data:
  sarembok-caddy-config:
