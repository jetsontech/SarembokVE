services:
  sarembok-runtime:
    ports: !reset []
    environment:
      SAREMBOK_AUTH_TOKEN: ${SAREMBOK_AUTH_TOKEN:-}
      # Intelligence Provider Interface
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      SAREMBOK_GEMINI_API: ${SAREMBOK_GEMINI_API:-interactions}
      SAREMBOK_GEMINI_THINKING_LEVEL: ${SAREMBOK_GEMINI_THINKING_LEVEL:-low}
      SAREMBOK_PROVIDER_ORDER: ${SAREMBOK_PROVIDER_ORDER:-Gemini,OpenRouter,Groq,OpenAI,Custom}
      LLM_ENDPOINT_URL: ${LLM_ENDPOINT_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-oss-120b}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      SAREMBOK_LLM_MAX_OUTPUT_TOKENS: ${SAREMBOK_LLM_MAX_OUTPUT_TOKENS:-800}

  sarembok-browser:
    build:
      context: ./browser
      dockerfile: Dockerfile
    image: sarembok-browser:production
    container_name: sarembok-browser
    restart: unless-stopped
    expose:
      - "9100"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  sarembok-edge:
    build:
      context: ./edge
      dockerfile: Dockerfile
    image: sarembok-edge:production
    container_name: sarembok-edge
    restart: unless-stopped
    depends_on:
      sarembok-runtime:
        condition: service_healthy
    environment:
      SAREMBOK_SITE_ADDRESS: ${SAREMBOK_PUBLIC_HOST:-${SAREMBOK_SITE_ADDRESS:-sarembok.com}}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}

    ports:
      - "80:80"
      - "443:443"
    volumes:
      - sarembok-caddy-data:/data
      - sarembok-caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  sarembok-caddy-data:
  sarembok-caddy-config:
