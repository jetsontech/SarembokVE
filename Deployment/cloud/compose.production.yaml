services:
  sarembok-runtime:
    ports: !reset []
    environment:
      SAREMBOK_AUTH_TOKEN: ${SAREMBOK_AUTH_TOKEN:?Set SAREMBOK_AUTH_TOKEN before starting production}

  sarembok-edge:
    build:
      context: ./edge
      dockerfile: Dockerfile
    image: sarembok-edge:production
    container_name: sarembok-edge
    restart: unless-stopped
    depends_on:
      sarembok-runtime:
        condition: service_healthy
    environment:
      SAREMBOK_SITE_ADDRESS: ${SAREMBOK_PUBLIC_HOST:-${SAREMBOK_SITE_ADDRESS:-sarembok.com}}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN before starting production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - sarembok-caddy-data:/data
      - sarembok-caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  sarembok-caddy-data:
  sarembok-caddy-config:
