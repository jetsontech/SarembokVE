services:
  sarembok-runtime:
    ports: !reset []
    environment:
      SAREMBOK_AUTH_TOKEN: ${SAREMBOK_AUTH_TOKEN:?Set SAREMBOK_AUTH_TOKEN before starting production}

  sarembok-edge:
    image: caddy:2-alpine
    container_name: sarembok-edge
    restart: unless-stopped
    depends_on:
      sarembok-runtime:
        condition: service_healthy
    environment:
      SAREMBOK_SITE_ADDRESS: ${SAREMBOK_PUBLIC_HOST:-${SAREMBOK_SITE_ADDRESS:-sarembok.com}}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - sarembok-caddy-data:/data
      - sarembok-caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  sarembok-caddy-data:
  sarembok-caddy-config:
