services:
  sarembok-runtime:
    build:
      context: ../..
      dockerfile: Deployment/cloud/Dockerfile
    container_name: sarembok-runtime
    restart: unless-stopped
    environment:
      SAREMBOK_PORT: "9000"
      SAREMBOK_DB_PATH: /data/sarembok_cloud.db
    ports:
      - "9000:9000"
    volumes:
      - sarembok-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  sarembok-data:
