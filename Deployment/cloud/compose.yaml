services:
  sarembok-browser:
    build:
      context: ./browser
      dockerfile: Dockerfile
    container_name: sarembok-browser
    restart: unless-stopped
    init: true
    environment:
      SAREMBOK_BROWSER_PORT: "9100"
      SAREMBOK_BROWSER_MAX_TEXT: ${SAREMBOK_BROWSER_MAX_TEXT:-120000}
      SAREMBOK_BROWSER_NAVIGATION_TIMEOUT_MS: ${SAREMBOK_BROWSER_NAVIGATION_TIMEOUT_MS:-15000}
      SAREMBOK_BROWSER_ALLOWED_HOSTS: ${SAREMBOK_BROWSER_ALLOWED_HOSTS:-*}
    expose:
      - "9100"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  sarembok-runtime:
    build:
      context: ../..
      dockerfile: Deployment/cloud/Dockerfile
    container_name: sarembok-runtime
    restart: unless-stopped
    init: true
    environment:
      SAREMBOK_PORT: "9000"
      SAREMBOK_DB_PATH: /data/sarembok_cloud.db
      SAREMBOK_AUTH_TOKEN: ${SAREMBOK_AUTH_TOKEN:-}
      SAREMBOK_MAX_CONNECTIONS: ${SAREMBOK_MAX_CONNECTIONS:-100}
      SAREMBOK_MAX_REQUEST_BYTES: ${SAREMBOK_MAX_REQUEST_BYTES:-1048576}
      SAREMBOK_LOG_LEVEL: ${SAREMBOK_LOG_LEVEL:-INFO}
      # Intelligence Provider Interface
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      SAREMBOK_GEMINI_API: ${SAREMBOK_GEMINI_API:-generatecontent}
      SAREMBOK_GEMINI_THINKING_LEVEL: ${SAREMBOK_GEMINI_THINKING_LEVEL:-low}
      SAREMBOK_PROVIDER_ORDER: ${SAREMBOK_PROVIDER_ORDER:-OpenRouter,Gemini,Groq,OpenAI,Custom}
      LLM_ENDPOINT_URL: ${LLM_ENDPOINT_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      SAREMBOK_LLM_PROVIDER_TIMEOUT_SECONDS: ${SAREMBOK_LLM_PROVIDER_TIMEOUT_SECONDS:-25}
      SAREMBOK_LLM_TOTAL_TIMEOUT_SECONDS: ${SAREMBOK_LLM_TOTAL_TIMEOUT_SECONDS:-35}
      SAREMBOK_LLM_MAX_OUTPUT_TOKENS: ${SAREMBOK_LLM_MAX_OUTPUT_TOKENS:-750}

    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sarembok-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,socket; s=socket.create_connection(('127.0.0.1',int(os.getenv('SAREMBOK_PORT','9000'))),2); s.close()\""]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  sarembok-data:
