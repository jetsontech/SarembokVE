name: Sarembok Runtime Quality

on:
  push:
    branches: [main, 'code-audit/**']
  pull_request:
    branches: [main]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile runtime Python
        run: python -m compileall -q Deployment/cloud
      - name: Run capability regression tests
        run: python Deployment/cloud/test_capabilities.py
