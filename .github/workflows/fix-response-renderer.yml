name: Fix Sarembok Response Renderer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-renderer:
    if: github.event.head_commit.message != 'fix: normalize Sarembok renderer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch existing markdown renderer
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('frontend/index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'SAREMBOK_RENDERER_NORMALIZATION_20260914'
          if marker in s:
              raise SystemExit('already patched')
          needle = 'let s = String(text);'
          replacement = '''let s = String(text);\n\n            /* SAREMBOK_RENDERER_NORMALIZATION_20260914\n             * Normalize escaped Markdown emitted by providers and preserve\n             * structural newlines before the existing rich renderer runs.\n             */\n            s = s.replace(/\\\\n/g, "\\n");\n            s = s.replace(/\\\\([*_`#|])/g, "$1");\n            s = s.replace(/([.!?])\\s+-\\s+(?=\\*\\*|[A-Za-z])/g, "$1\\n- ");\n            s = s.replace(/\\s+(?=\\d+\\.\\s+\\*\\*)/g, "\\n");'''
          if s.count(needle) != 1:
              raise SystemExit(f'expected one renderer anchor, found {s.count(needle)}')
          s = s.replace(needle, replacement, 1)

          css = '''\n        /* SAREMBOK_RESPONSE_FORMATTING_20260914 */\n        .srbk-dialogue-content, .srbk-message-content, .dialogue-content { user-select:text !important; -webkit-user-select:text !important; }\n        .srbk-table-wrap { width:100%; overflow-x:auto; margin:14px 0; }\n        .srbk-table-wrap table { width:100%; border-collapse:collapse; table-layout:auto; }\n        .srbk-table-wrap th, .srbk-table-wrap td { padding:9px 11px; border:1px solid rgba(0,240,255,.12); text-align:left; vertical-align:top; line-height:1.5; }\n        .srbk-table-wrap th { background:rgba(0,240,255,.07); color:#fff; font-weight:700; }\n        .srbk-table-wrap td { color:#dbe4f0; }\n        '''
          if 'SAREMBOK_RESPONSE_FORMATTING_20260914' not in s:
              s = s.replace('</style>', css + '\n    </style>', 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit patched renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html
          git commit -m "fix: normalize Sarembok renderer" || exit 0
          git push
      - name: Remove patch workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-response-renderer.yml
          git add .github/workflows/fix-response-renderer.yml
          git commit -m "chore: remove one-shot renderer workflow" || exit 0
          git push
