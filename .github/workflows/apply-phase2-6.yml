name: Apply Sarembok latency architecture

on:
  push:
    paths:
      - Tools/Engineering/phase2_6_implementation.py

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply implementation
        run: python3 Tools/Engineering/phase2_6_implementation.py
      - name: Syntax validation
        run: python3 -m py_compile Deployment/cloud/server.py Deployment/cloud/provider_router.py Deployment/cloud/capability_registry.py Deployment/cloud/structured_response.py
      - name: Contract tests
        run: python3 -m pytest Deployment/cloud/test_phase2_6.py -q
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Deployment/cloud/server.py Deployment/cloud/provider_router.py Deployment/cloud/capability_registry.py Deployment/cloud/structured_response.py Deployment/cloud/compose.production.yaml Deployment/cloud/test_phase2_6.py
          git commit -m "feat: implement latency provider and capability architecture"
          git rm Tools/Engineering/phase2_6_implementation.py .github/workflows/apply-phase2-6.yml
          git commit -m "chore: remove temporary architecture implementation tooling"
          git push
