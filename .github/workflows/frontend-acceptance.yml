name: SarembokVE Frontend Acceptance

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Chromium acceptance against production
        run: |
          docker run --rm --ipc=host \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.55.0-noble \
            bash -lc 'npm install --no-save playwright@1.55.0 >/tmp/playwright-install.log 2>&1 && node Deployment/cloud/frontend_browser_acceptance_20260914.mjs https://sarembok.com/'
