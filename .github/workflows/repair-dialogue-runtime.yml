name: Repair dialogue runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair provider block
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Deployment/cloud/server.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('    # 6. Try LLM providers')
          end = s.index('\n\ndef _save_conversation', start)
          block = '''    # 6. Try configured LLM providers in deterministic fallback order.
          providers = []
          openai_key = os.getenv("OPENAI_API_KEY") or (api_key if (api_key or "").startswith("sk-") else None)
          if openai_key and len(openai_key) > 20:
              providers.append(("OpenAI", "https://api.openai.com/v1/chat/completions", openai_key, os.getenv("OPENAI_MODEL", "gpt-4o")))
          openrouter_key = os.getenv("OPENROUTER_API_KEY")
          if openrouter_key:
              providers.append(("OpenRouter", "https://openrouter.ai/api/v1/chat/completions", openrouter_key, os.getenv("OPENROUTER_MODEL", "openai/gpt-oss-120b")))
          groq_key = os.getenv("GROQ_API_KEY")
          if groq_key:
              providers.append(("Groq", "https://api.groq.com/openai/v1/chat/completions", groq_key, os.getenv("GROQ_MODEL", "openai/gpt-oss-120b")))
          gemini_key = os.getenv("GEMINI_API_KEY")
          if gemini_key:
              gemini_model = os.getenv("GEMINI_MODEL", "gemini-2.5-flash")
              providers.append(("Gemini", f"https://generativelanguage.googleapis.com/v1beta/models/{gemini_model}:generateContent?key={gemini_key}", gemini_key, gemini_model))
          custom_llm_url = os.getenv("LLM_ENDPOINT_URL")
          if custom_llm_url:
              providers.append(("Custom", custom_llm_url, os.getenv("LLM_API_KEY", "dummy"), os.getenv("LLM_MODEL", "llama-3.1-8b")))

          reply = None
          llm_source = None
          for p_name, p_url, p_key, p_model in providers:
              try:
                  if p_name == "Gemini":
                      req_data = {"contents": [{"parts": [{"text": system_prompt + "\\n\\nUser: " + prompt_clean}]}]}
                      headers = {"Content-Type": "application/json"}
                  else:
                      req_data = {"model": p_model, "messages": messages, "max_tokens": 800, "temperature": 0.7}
                      headers = {"Content-Type": "application/json", "Authorization": f"Bearer {p_key}"}
                      if p_name == "OpenRouter":
                          headers.update({"HTTP-Referer": "https://sarembok.com", "X-Title": "Sarembok VE"})
                  request = urllib.request.Request(p_url, data=json.dumps(req_data).encode("utf-8"), headers=headers)
                  with urllib.request.urlopen(request, timeout=LLM_PROVIDER_TIMEOUT_SECONDS) as http_resp:
                      payload = json.loads(http_resp.read().decode("utf-8"))
                  if p_name == "Gemini":
                      reply = payload["candidates"][0]["content"]["parts"][0]["text"].strip()
                  else:
                      reply = payload["choices"][0]["message"]["content"].strip()
                  llm_source = p_name
                  break
              except Exception as exc:
                  LOG.warning("LLM provider %s failed; trying next provider: %s", p_name, exc)

          if reply is not None:
              _save_conversation(session_id, prompt_clean, reply)
              store.event("sarembok-prime", "CHAT_RESPONSE", {"prompt": prompt_clean[:200], "model": p_model, "provider": llm_source})
              audio_text = reply[:300].replace("*", "").replace("`", "").replace("#", "")
              return {"response": reply, "audioText": audio_text, "source": llm_source, "action": None}

          reply = ("I can't reach a language model right now. "
                   "The runtime has no responding provider available. "
                   "Local runtime capabilities remain available.")
          _save_conversation(session_id, prompt_clean, reply)
          return {"response": reply, "audioText": reply, "source": "offline", "action": None}
          '''
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
          compile(s, 'Deployment/cloud/server.py', 'exec')
          print('syntax validation passed')
          PY
      - name: Remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Deployment/cloud/server.py
          git commit -m "fix: repair dialogue provider chain" || true
          rm .github/workflows/repair-dialogue-runtime.yml
          git add .github/workflows/repair-dialogue-runtime.yml
          git commit -m "chore: remove dialogue repair workflow" || true
          git push