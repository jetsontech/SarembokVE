name: Wire SarembokVE UI refinement

on:
  push:
    branches: [main]
    paths:
      - 'frontend/ui-refinement-20260914.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-stylesheet:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Link UI refinement stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('frontend/index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'ui-refinement-20260914.css'
          tag = '<link rel="stylesheet" href="/ui-refinement-20260914.css">'

          if marker not in s:
              anchor = '</head>'
              if anchor not in s:
                  raise SystemExit('frontend/index.html has no </head> anchor')
              s = s.replace(anchor, f'    {tag}\n{anchor}', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit stylesheet wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: activate conversation-first UI refinement'
          git push
