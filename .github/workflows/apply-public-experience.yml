name: Apply public experience patch

on:
  push:
    branches:
      - codex/sarembok-public-experience
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python tools/enable-public-experience.py

      - name: Validate Python syntax
        run: python -m py_compile Deployment/cloud/server.py

      - name: Commit patched application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Deployment/cloud/server.py frontend/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Make public Sarembok experience runtime-backed [skip ci]"
          git push origin HEAD:codex/sarembok-public-experience
