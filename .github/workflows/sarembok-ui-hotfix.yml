name: Sarembok UI Hotfix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  hotfix:
    if: github.event.head_commit.message != 'fix: apply Sarembok UI hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch frontend renderer and UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* SAREMBOK_UI_HOTFIX_2026_09_14 */'
          if marker in s:
              raise SystemExit('hotfix already present')
          patch = r'''<script>
          /* SAREMBOK_UI_HOTFIX_2026_09_14 */
          (() => {
            'use strict';

            const esc = (v) => String(v ?? '')
              .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
              .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

            const inline = (v) => {
              let s = String(v ?? '');
              s = s.replace(/\\([*_`#|])/g, '$1');
              s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
              s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
              s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
              s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
              s = s.replace(/_([^_]+)_/g, '<em>$1</em>');
              return s;
            };

            function renderTable(lines) {
              const rows = lines.filter(Boolean).map(x => x.trim().replace(/^\||\|$/g,'').split('|').map(c => c.trim()));
              if (rows.length < 2) return '';
              const head = rows[0];
              const body = rows.slice(2);
              return '<div class="srbk-md-table-wrap"><table class="srbk-md-table"><thead><tr>' + head.map(c=>'<th>'+inline(esc(c))+'</th>').join('') + '</tr></thead><tbody>' + body.map(r=>'<tr>'+head.map((_,i)=>'<td>'+inline(esc(r[i] ?? ''))+'</td>').join('')+'</tr>').join('') + '</tbody></table></div>';
            }

            function renderer(text) {
              if (text == null) return '';
              let src = String(text).replace(/\\([*_`#|])/g,'$1').replace(/\\n/g,'\n');
              const blocks = [];
              src = src.replace(/```([\s\S]*?)```/g, (_, code) => {
                const id = blocks.length; blocks.push('<pre class="srbk-md-code"><code>'+esc(code.trim())+'</code></pre>'); return `@@CODE${id}@@`;
              });
              const lines = src.split(/\r?\n/);
              const out = [];
              let list = null;
              const flush = () => { if (list) { out.push('<'+list.tag+'>'+list.items.join('')+'</'+list.tag+'>'); list=null; } };
              for (let i=0;i<lines.length;i++) {
                const raw=lines[i], t=raw.trim();
                if (!t) { flush(); continue; }
                if (/^\|.+\|$/.test(t) && i+1<lines.length && /^\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?$/.test(lines[i+1].trim())) {
                  const table=[t]; i+=2; while(i<lines.length && /^\|.+\|$/.test(lines[i].trim())) table.push(lines[i].trim()), i++; i--; flush(); out.push(renderTable(table)); continue;
                }
                let m=t.match(/^#{1,6}\s+(.+)$/); if(m){flush(); const n=Math.min(6,(t.match(/^#+/)[0]).length); out.push(`<h${n}>${inline(esc(m[1]))}</h${n}>`); continue;}
                m=t.match(/^[-*+]\s+(.+)$/); if(m){ if(!list||list.tag!=='ul'){flush();list={tag:'ul',items:[]};} list.items.push('<li>'+inline(esc(m[1]))+'</li>'); continue; }
                m=t.match(/^\d+[.)]\s+(.+)$/); if(m){ if(!list||list.tag!=='ol'){flush();list={tag:'ol',items:[]};} list.items.push('<li>'+inline(esc(m[1]))+'</li>'); continue; }
                if(/^>\s?/.test(t)){flush();out.push('<blockquote>'+inline(esc(t.replace(/^>\s?/,'')))+'</blockquote>');continue;}
                if(/^---+$/.test(t)){flush();out.push('<hr>');continue;}
                flush();
                const safe=esc(raw);
                out.push('<p>'+inline(safe)+'</p>');
              }
              flush();
              let html=out.join('');
              html=html.replace(/@@CODE(\d+)@@/g,(_,i)=>blocks[Number(i)]);
              return html;
            }

            window.formatMarkdown = renderer;
            window.renderMarkdown = renderer;
            window.md = renderer;

            const css = document.createElement('style');
            css.textContent = `
              .srbk-bubble .srbk-md-table-wrap{width:100%;overflow-x:auto;margin:12px 0;border:1px solid rgba(0,240,255,.12);border-radius:10px}
              .srbk-bubble .srbk-md-table{width:100%;border-collapse:collapse;min-width:520px;font-size:13px;line-height:1.45}
              .srbk-bubble .srbk-md-table th,.srbk-bubble .srbk-md-table td{padding:9px 11px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;vertical-align:top}
              .srbk-bubble .srbk-md-table th{font-weight:700;color:#fff;background:rgba(0,240,255,.07)}
              .srbk-bubble .srbk-md-table td{color:#dbe4f0}
              .srbk-bubble p{margin:0 0 10px;line-height:1.65}
              .srbk-bubble h1,.srbk-bubble h2,.srbk-bubble h3,.srbk-bubble h4{margin:16px 0 8px;line-height:1.25}
              .srbk-bubble ul,.srbk-bubble ol{margin:6px 0 12px 22px;padding:0;line-height:1.6}
              .srbk-bubble li{margin:3px 0}
              .srbk-bubble blockquote{margin:10px 0;padding:8px 12px;border-left:3px solid var(--cyan);background:rgba(0,240,255,.05);color:#cbd5e1}
              .srbk-bubble pre.srbk-md-code{white-space:pre-wrap;overflow:auto;padding:12px;margin:10px 0;border-radius:8px;background:#02050a;border:1px solid rgba(255,255,255,.08)}
              .srbk-bubble code{font-family:var(--font-mono);font-size:.92em}
              #dialogue-history,.srbk-bubble,.srbk-bubble *{user-select:text!important;-webkit-user-select:text!important}
            `;
            document.head.appendChild(css);

            function normalizeVisibleCopy() {
              const root=document.body;
              const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
              const nodes=[]; let n; while(n=walker.nextNode()) nodes.push(n);
              for(const node of nodes){
                let v=node.nodeValue;
                if(!v || !v.trim()) continue;
                v=v.replace(/Aria Health/gi,'Sarembok Health')
                   .replace(/Astra Vision/gi,'Vision & Screen Perception')
                   .replace(/Astra Camera/gi,'Camera Perception')
                   .replace(/Sovereign cluster ready/gi,'Sarembok runtime ready')
                   .replace(/sovereign cluster/gi,'Sarembok runtime');
                node.nodeValue=v;
              }
              const active=document.getElementById('active-model-select');
              if(active){
                const allowed=new Set(['gpt-4o-mini','gpt-oss-120b']);
                [...active.options].forEach(o=>{ if(!allowed.has(o.value)) o.remove(); });
                if(![...active.options].some(o=>o.value==='auto')){
                  const o=document.createElement('option'); o.value='auto'; o.textContent='Sarembok Auto Router'; active.prepend(o);
                }
              }
              const reasoning=document.getElementById('user-ai-model-select');
              if(reasoning){
                [...reasoning.options].forEach(o=>{ if(!/gpt-4o-mini|gpt-oss-120b/i.test(o.textContent)) o.remove(); });
              }
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',normalizeVisibleCopy,{once:true}); else normalizeVisibleCopy();
            new MutationObserver(()=>normalizeVisibleCopy()).observe(document.body,{childList:true,subtree:true});
          })();
          </script>
          '''
          s=s.replace('</body>', patch+'\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html
          git commit -m "fix: apply Sarembok UI hotfix" || exit 0
          git push
