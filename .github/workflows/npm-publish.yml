name: Publish Sarembok CLI to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify package version matches release tag
        run: |
          node --input-type=commonjs <<'NODE'
          const { version } = require('./package.json');
          if (process.env.GITHUB_REF_NAME !== 'v' + version) {
            console.error('Release tag must match package version v' + version);
            process.exit(1);
          }
          NODE

      - name: Install dependencies & run fast tests
        run: |
          npm ci
          npm run test:fast

      - name: Publish to npm with OIDC Provenance
        run: npm publish --provenance --access public
