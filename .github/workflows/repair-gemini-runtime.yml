name: Repair Gemini runtime

on:
  push:
    paths:
      - Deployment/cloud/REPAIR_TRIGGER

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply repair
        run: python Deployment/cloud/repair_gemini.py

      - name: Validate
        run: |
          python -m py_compile Deployment/cloud/server.py
          grep -q 'gemini-3.8-flash' Deployment/cloud/server.py
          grep -q 'x-goog-api-key' Deployment/cloud/server.py
          grep -q 'LLM_TOTAL_TIMEOUT_SECONDS' Deployment/cloud/server.py
          grep -q 'asyncio.to_thread(dispatch' Deployment/cloud/server.py
          ! grep -q 'gemini-2.5-flash' Deployment/cloud/server.py

      - name: Commit repair and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm Deployment/cloud/repair_gemini.py Deployment/cloud/REPAIR_TRIGGER .github/workflows/repair-gemini-runtime.yml
          git add Deployment/cloud/server.py Deployment/cloud/compose.production.yaml
          git commit -m "fix: repair Gemini provider and dialogue execution"
          git push
