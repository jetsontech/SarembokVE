name: Fix browser RPC scope

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-browser-rpc-scope.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix browser RPC scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('Deployment/cloud/server.py')
          text = path.read_text()
          old = 'BROWSER_ALLOWED_METHODS = {"SarembokChat", "RuntimeInfo", "Health"}'
          new = 'BROWSER_ALLOWED_METHODS = {"SarembokChat", "GetRuntimeInfo"}'
          if old not in text:
              raise SystemExit('expected browser RPC scope not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python -m py_compile Deployment/cloud/server.py
          grep -n 'BROWSER_ALLOWED_METHODS' Deployment/cloud/server.py

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Deployment/cloud/server.py
          git commit -m 'fix: allow browser GetRuntimeInfo RPC'
          git push origin HEAD:main

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/fix-browser-rpc-scope.yml
          git commit -m 'chore: remove temporary browser scope workflow'
          git push origin HEAD:main
