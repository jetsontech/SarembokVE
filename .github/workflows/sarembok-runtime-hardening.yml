name: Sarembok runtime hardening

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Harden dialogue UI and runtime fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # -----------------------------
          # Frontend: replace the previous presentation patch with V3.
          # -----------------------------
          p = Path('frontend/index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- SAREMBOK_RESPONSE_UI_V3 -->'
          start = text.find('<!-- SAREMBOK_RESPONSE_UI_V2 -->')
          if start < 0:
              start = text.find(marker)
          if start < 0:
              raise SystemExit('response UI marker not found')

          end = text.find('</body>', start)
          if end < 0:
              raise SystemExit('body close not found')

          block = r'''<!-- SAREMBOK_RESPONSE_UI_V3 -->
          <style>
            .dialogue-history{max-height:460px;min-height:280px;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:14px;padding:4px 6px 10px 2px;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:rgba(0,240,255,.28) transparent}
            .dialogue-history::-webkit-scrollbar{width:6px}.dialogue-history::-webkit-scrollbar-track{background:transparent}.dialogue-history::-webkit-scrollbar-thumb{background:rgba(0,240,255,.22);border-radius:99px}
            .srbk-message{width:100%;display:flex;gap:10px;align-items:flex-start;animation:srbkMessageIn .28s cubic-bezier(.16,1,.3,1)}
            .srbk-message.user{justify-content:flex-end}
            .srbk-avatar{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border:1px solid rgba(0,240,255,.32);border-radius:50%;color:var(--cyan);background:rgba(0,240,255,.06);font-family:var(--font-mono);font-size:9px;letter-spacing:.5px;box-shadow:0 0 18px rgba(0,240,255,.08)}
            .srbk-avatar.user-avatar{order:2;color:#dbeafe;border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.05)}
            .srbk-bubble{min-width:0;max-width:min(88%,920px);padding:13px 16px;border:1px solid var(--border-glass);border-radius:15px;background:rgba(15,20,31,.72);box-shadow:0 8px 30px rgba(0,0,0,.18)}
            .srbk-message.user .srbk-bubble{background:rgba(0,240,255,.055);border-color:rgba(0,240,255,.16);border-bottom-right-radius:5px}.srbk-message.ai .srbk-bubble{border-bottom-left-radius:5px}
            .srbk-meta{display:flex;align-items:center;gap:8px;margin-bottom:7px;color:var(--text-muted);font-family:var(--font-mono);font-size:9px;letter-spacing:1.2px;text-transform:uppercase}.srbk-meta strong{color:var(--cyan);font-weight:500}.srbk-message.user .srbk-meta{justify-content:flex-end}.srbk-message.user .srbk-meta strong{color:#dbeafe}
            .srbk-content{color:#e8edf5;font-size:14px;line-height:1.72;user-select:text;overflow-wrap:anywhere}.srbk-content>:first-child{margin-top:0}.srbk-content>:last-child{margin-bottom:0}.srbk-content p{margin:0 0 .9em}.srbk-content h1,.srbk-content h2,.srbk-content h3{color:#fff;font-weight:500;line-height:1.3;letter-spacing:.2px;margin:1.15em 0 .55em}.srbk-content h1{font-size:20px}.srbk-content h2{font-size:17px}.srbk-content h3{font-size:15px;color:var(--cyan)}
            .srbk-content ul,.srbk-content ol{margin:.35em 0 1em 1.25em;padding-left:1em}.srbk-content li{margin:.28em 0;padding-left:.2em}.srbk-content li::marker{color:var(--cyan)}.srbk-content strong{color:#fff;font-weight:650}.srbk-content em{color:#cbd5e1}.srbk-content a{color:var(--cyan);text-decoration:none;border-bottom:1px solid rgba(0,240,255,.25)}.srbk-content a:hover{border-bottom-color:var(--cyan)}.srbk-content blockquote{margin:.9em 0;padding:.55em .9em;border-left:2px solid var(--cyan);background:rgba(0,240,255,.035);color:#b8c3d5}.srbk-content hr{border:0;border-top:1px solid var(--border-glass);margin:1.2em 0}.srbk-content code{padding:.14em .38em;border-radius:5px;background:rgba(255,255,255,.065);color:#d8fbff;font-family:var(--font-mono);font-size:.88em}
            .srbk-code{margin:.95em 0;overflow:hidden;border:1px solid rgba(255,255,255,.09);border-radius:10px;background:#05070b}.srbk-code-head{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.025);color:var(--text-muted);font-family:var(--font-mono);font-size:9px;letter-spacing:1px;text-transform:uppercase}.srbk-copy{border:0;background:transparent;color:var(--text-muted);cursor:pointer;font:inherit;text-transform:uppercase}.srbk-copy:hover{color:var(--cyan)}.srbk-code pre{margin:0;padding:13px 14px;overflow-x:auto;color:#d7e3ef;font:12px/1.65 var(--font-mono);user-select:text}
            .srbk-table-wrap{overflow-x:auto;margin:.9em 0}.srbk-table{width:100%;border-collapse:collapse;min-width:420px;font-size:12px}.srbk-table th,.srbk-table td{padding:8px 10px;border:1px solid rgba(255,255,255,.07);text-align:left;vertical-align:top}.srbk-table th{color:var(--cyan);background:rgba(0,240,255,.045);font-family:var(--font-mono);font-size:10px;letter-spacing:.5px}.srbk-table td{color:#cbd5e1}
            .srbk-thinking{display:inline-flex;align-items:center;gap:5px;color:var(--text-secondary)}.srbk-thinking i{width:5px;height:5px;border-radius:50%;background:var(--cyan);animation:srbkPulse 1.1s infinite ease-in-out}.srbk-thinking i:nth-child(2){animation-delay:.15s}.srbk-thinking i:nth-child(3){animation-delay:.3s}
            .srbk-status{display:flex;align-items:center;gap:6px;margin-top:9px;color:var(--text-muted);font:9px var(--font-mono);letter-spacing:.9px;text-transform:uppercase}.srbk-status::before{content:'✓';color:var(--emerald)}.srbk-error{color:#fda4af}.srbk-error::before{content:'!';color:#fb7185}
            @keyframes srbkMessageIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@keyframes srbkPulse{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
            @media(max-width:700px){.dialogue-history{min-height:240px;max-height:52vh}.srbk-bubble{max-width:94%;padding:11px 13px}.srbk-content{font-size:13.5px;line-height:1.65}.input-bar{flex-direction:column}.btn-action{width:100%}}
          </style>
          <script>
          (()=>{
            const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
            const url=v=>/^https?:\/\//i.test(v)?v:'';
            const inline=v=>{let h=esc(v);h=h.replace(/`([^`]+)`/g,'<code>$1</code>');h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');h=h.replace(/__([^_]+)__/g,'<strong>$1</strong>');h=h.replace(/\*([^*]+)\*/g,'<em>$1</em>');h=h.replace(/_([^_]+)_/g,'<em>$1</em>');h=h.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/gi,(_,l,u)=>{const s=url(u);return s?`<a href="${s}" target="_blank" rel="noopener noreferrer">${l}</a>`:l});h=h.replace(/&lt;br\s*\/?&gt;/gi,'<br>');return h};
            const table=lines=>{if(lines.length<2||!/^[|\s]*:?-{3,}:?\s*(?:\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(lines[1]))return null;const parse=x=>x.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(s=>s.trim());const hs=parse(lines[0]);let h='<div class="srbk-table-wrap"><table class="srbk-table"><thead><tr>'+hs.map(x=>`<th>${inline(x)}</th>`).join('')+'</tr></thead><tbody>';for(const r of lines.slice(2).map(parse))h+='<tr>'+hs.map((_,i)=>`<td>${inline(r[i]??'')}</td>`).join('')+'</tr>';return h+'</tbody></table></div>'};
            function md(src){let t=String(src??'').replace(/\r\n?/g,'\n').trim();const blocks=[];t=t.replace(/```([\w.+#-]*)\n([\s\S]*?)```/g,(_,lang,code)=>{const k=`@@CODE${blocks.length}@@`;blocks.push(`<div class="srbk-code"><div class="srbk-code-head"><span>${esc(lang||'code')}</span><button class="srbk-copy" type="button" data-copy="${encodeURIComponent(code)}">Copy</button></div><pre><code>${esc(code.replace(/\n$/,''))}</code></pre></div>`);return k});const ls=t.split('\n'),out=[];let i=0;while(i<ls.length){let l=ls[i];if(!l.trim()){i++;continue}if(i+1<ls.length&&/\|/.test(l)){const a=[l,ls[i+1]];if(table(a)){i+=2;while(i<ls.length&&ls[i].trim()&&/\|/.test(ls[i]))a.push(ls[i++]);out.push(table(a));continue}}let m=l.match(/^\s{0,3}(#{1,3})\s+(.+?)\s*#*$/);if(m){out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);i++;continue}if(/^\s*([-*_])(?:\s*\1){2,}\s*$/.test(l)){out.push('<hr>');i++;continue}if(/^\s*[-*+]\s+/.test(l)||/^\s*\d+[.)]\s+/.test(l)){const ord=/^\s*\d+[.)]\s+/.test(l),items=[];while(i<ls.length){const m2=ls[i].match(ord?/^\s*\d+[.)]\s+(.+)$/:/^\s*[-*+]\s+(.+)$/);if(!m2)break;items.push(`<li>${inline(m2[1])}</li>`);i++}out.push(`<${ord?'ol':'ul'}>${items.join('')}</${ord?'ol':'ul'}>`);continue}if(/^\s*>/.test(l)){const q=[];while(i<ls.length&&/^\s*>/.test(ls[i]))q.push(ls[i++].replace(/^\s*>\s?/,''));out.push(`<blockquote>${q.map(inline).join('<br>')}</blockquote>`);continue}const para=[];while(i<ls.length&&ls[i].trim()&&!/^\s{0,3}#{1,3}\s+/.test(ls[i])&&!/^\s*[-*+]\s+/.test(ls[i])&&!/^\s*\d+[.)]\s+/.test(ls[i])&&!/^\s*>/.test(ls[i]))para.push(ls[i++]);out.push(`<p>${para.map(inline).join('<br>')}</p>`)}return out.join('').replace(/@@CODE(\d+)@@/g,(_,n)=>blocks[+n]||'')}
            const scroll=()=>{const h=document.getElementById('dialogue-history');if(h)requestAnimationFrame(()=>h.scrollTop=h.scrollHeight)};
            const msg=(role,body,thinking=false)=>{const row=document.createElement('div');row.className=`srbk-message ${role}`;const av=document.createElement('div');av.className=`srbk-avatar ${role==='user'?'user-avatar':''}`;av.textContent=role==='user'?'YOU':'ARIA';const b=document.createElement('div');b.className='srbk-bubble';const meta=document.createElement('div');meta.className='srbk-meta';meta.innerHTML=`<strong>${role==='user'?'YOU':'ARIA'}</strong><span>${role==='user'?'DIRECTIVE':'SYNTHESIS'}</span>`;const c=document.createElement('div');c.className='srbk-content';c.innerHTML=thinking?'<span class="srbk-thinking">Processing <i></i><i></i><i></i></span>':md(body);b.append(meta,c);row.append(role==='user'?b:av,role==='user'?av:b);return{row,body:c}};
            const copy=root=>root.querySelectorAll('.srbk-copy').forEach(x=>{if(x.dataset.wired)return;x.dataset.wired='1';x.onclick=async()=>{try{await navigator.clipboard.writeText(decodeURIComponent(x.dataset.copy||''));x.textContent='Copied';setTimeout(()=>x.textContent='Copy',1200)}catch(_){x.textContent='Unavailable';setTimeout(()=>x.textContent='Copy',1200)}}});
            window.sendDirective=async()=>{const input=document.getElementById('directive-input'),history=document.getElementById('dialogue-history');if(!input||!history)return;const txt=input.value.trim();if(!txt)return;input.value='';input.disabled=true;const u=msg('user',txt);history.appendChild(u.row);scroll();const a=msg('ai','',true);history.appendChild(a.row);scroll();try{const r=await sendRPC('SarembokChat',{prompt:txt});const reply=typeof r?.response==='string'?r.response:typeof r?.audioText==='string'?r.audioText:(r?JSON.stringify(r,null,2):'Directive executed.');a.body.innerHTML=md(reply);const s=document.createElement('div');s.className='srbk-status';s.textContent='Synthesis complete';a.body.appendChild(s);copy(a.row)}catch(e){a.body.innerHTML=md('Unable to complete the directive.\\n\\n`'+String(e?.message||e)+'`');const s=document.createElement('div');s.className='srbk-status srbk-error';s.textContent='Runtime request failed';a.body.appendChild(s)}finally{input.disabled=false;input.focus();scroll()}};
            const h=document.getElementById('dialogue-history');if(h){const first=h.firstElementChild;if(first&&!first.classList.contains('srbk-message')){const welcome=first.textContent.replace(/^ARIA:\s*/i,'').trim();h.innerHTML='';h.appendChild(msg('ai',welcome).row)}copy(h)}
          })();
          </script>
          '''
          text = text[:start] + block + '\n' + text[end:]
          p.write_text(text, encoding='utf-8')

          # Client-side RPC budget: allow the server fallback chain to finish cleanly.
          text = p.read_text(encoding='utf-8')
          text = text.replace('setTimeout(() => { if (pending.has(id)) { pending.delete(id); rej(new Error("Timeout")); } }, 12000);', 'setTimeout(() => { if (pending.has(id)) { pending.delete(id); rej(new Error("Runtime request timeout")); } }, 45000);')
          p.write_text(text, encoding='utf-8')

          # -----------------------------
          # Runtime: configurable, bounded provider fallback.
          # -----------------------------
          s = Path('Deployment/cloud/server.py')
          st = s.read_text(encoding='utf-8')
          if 'SAREMBOK_LLM_PROVIDER_TIMEOUT_SECONDS' not in st:
              anchor = 'MAX_METHOD_LENGTH = max(32, int(os.getenv("SAREMBOK_MAX_METHOD_LENGTH", "128")))\n'
              ins = anchor + 'LLM_PROVIDER_TIMEOUT_SECONDS = max(5, int(os.getenv("SAREMBOK_LLM_PROVIDER_TIMEOUT_SECONDS", "10")))\n'
              if anchor not in st: raise SystemExit('server config anchor missing')
              st = st.replace(anchor, ins, 1)

          provider_anchor = '''    openai_key = os.getenv("OPENAI_API_KEY") or os.getenv("SAREMBOK_AUTH_TOKEN") or api_key
          if openai_key and openai_key.startswith("sk-") and len(openai_key) > 20:
              providers.append(("GPT-4o", "https://api.openai.com/v1/chat/completions", openai_key, "gpt-4o"))

          gemini_key = os.getenv("GEMINI_API_KEY")
          if gemini_key:
              providers.append(("Gemini", f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={gemini_key}", gemini_key, "gemini-1.5-flash"))

          custom_llm_url = os.getenv("LLM_ENDPOINT_URL")
          custom_llm_key = os.getenv("LLM_API_KEY", "dummy")
          if custom_llm_url:
              providers.append(("Custom", custom_llm_url, custom_llm_key, os.getenv("LLM_MODEL", "llama-3.1-8b")))
          '''
          provider_replacement = '''    openai_key = os.getenv("OPENAI_API_KEY") or (api_key if (api_key or "").startswith("sk-") else None)
          if openai_key and len(openai_key) > 20:
              providers.append(("OpenAI", "https://api.openai.com/v1/chat/completions", openai_key, os.getenv("OPENAI_MODEL", "gpt-4o")))

          openrouter_key = os.getenv("OPENROUTER_API_KEY")
          if openrouter_key:
              providers.append(("OpenRouter", "https://openrouter.ai/api/v1/chat/completions", openrouter_key, os.getenv("OPENROUTER_MODEL", "openai/gpt-oss-120b")))

          groq_key = os.getenv("GROQ_API_KEY")
          if groq_key:
              providers.append(("Groq", "https://api.groq.com/openai/v1/chat/completions", groq_key, os.getenv("GROQ_MODEL", "openai/gpt-oss-120b")))

          gemini_key = os.getenv("GEMINI_API_KEY")
          if gemini_key:
              providers.append(("Gemini", f"https://generativelanguage.googleapis.com/v1beta/models/{os.getenv('GEMINI_MODEL','gemini-2.5-flash')}:generateContent?key={gemini_key}", gemini_key, os.getenv("GEMINI_MODEL", "gemini-2.5-flash")))

          custom_llm_url = os.getenv("LLM_ENDPOINT_URL")
          custom_llm_key = os.getenv("LLM_API_KEY", "dummy")
          if custom_llm_url:
              providers.append(("Custom", custom_llm_url, custom_llm_key, os.getenv("LLM_MODEL", "llama-3.1-8b")))
          '''
          if provider_anchor in st:
              st = st.replace(provider_anchor, provider_replacement, 1)
          else:
              print('provider anchor already changed; leaving provider configuration intact')

          # OpenAI-compatible providers use the same request path. Gemini remains separate.
          st = st.replace('if p_name in ("GPT-4o", "Custom"):', 'if p_name in ("OpenAI", "OpenRouter", "Groq", "Custom"):')
          st = st.replace('headers={"Content-Type": "application/json", "Authorization": f"Bearer {p_key}"}', 'headers={"Content-Type": "application/json", "Authorization": f"Bearer {p_key}", **({"HTTP-Referer": "https://sarembok.com", "X-Title": "Sarembok VE"} if p_name == "OpenRouter" else {})}')
          st = st.replace('urlopen(http_req, timeout=12)', 'urlopen(http_req, timeout=LLM_PROVIDER_TIMEOUT_SECONDS)')

          # Truthful identity/capability behavior and secret hygiene.
          st = st.replace('"You have access to persistent memory, agent management, and task scheduling.",', '"You have access only to capabilities exposed by this runtime. Describe capabilities from actual runtime state; never invent tools or integrations.",')
          st = st.replace('"Do not claim capabilities you don\'t have.",', '"Do not claim capabilities you do not have. Provider/model details are implementation metadata, not your primary identity.",')
          st = st.replace('"",\n        f"System state:', '"Never ask users to store passwords, API keys, private keys, access tokens, or other secrets in conversational memory. If a user provides a secret, do not repeat it; recommend secure secret storage.",\n        "",\n        f"System state:', 1)

          s.write_text(st, encoding='utf-8')
          print('Hardening patch applied.')
          PY

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html Deployment/cloud/server.py
          git diff --cached --quiet || git commit -m "fix: harden dialogue rendering and provider fallback"
          rm -f .github/workflows/sarembok-runtime-hardening.yml
          git add .github/workflows/sarembok-runtime-hardening.yml
          git diff --cached --quiet || git commit -m "chore: remove one-shot hardening workflow"
          git push