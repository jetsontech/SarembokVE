name: Investor UI Polish

on:
  push:
    branches: [main]
    paths:
      - 'frontend/investor-polish.js'
      - '.github/workflows/investor-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inject polish bundle once
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'SAREMBOK_INVESTOR_POLISH_BUNDLE_V1'
          if marker in s:
              print('Investor polish already installed.')
              raise SystemExit(0)
          tag = '\n<!-- ' + marker + ' -->\n<script src="/investor-polish.js" defer></script>\n'
          if '</head>' not in s:
              raise SystemExit('index.html has no closing head tag')
          s = s.replace('</head>', tag + '</head>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit injected bundle
        shell: bash
        run: |
          git config user.name 'SarembokVE Automation'
          git config user.email 'actions@sarembok.com'
          git add frontend/index.html
          if git diff --cached --quiet; then
            echo 'No frontend change required.'
            exit 0
          fi
          git commit -m 'fix(ui): activate investor presentation polish [skip ci]'
          git push
