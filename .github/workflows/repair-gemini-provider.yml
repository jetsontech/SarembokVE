name: Repair Gemini Provider

on:
  push:
    paths:
      - Deployment/cloud/REPAIR_GEMINI

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Gemini provider resilience
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 Deployment/cloud/repair_gemini_provider.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Deployment/cloud/server.py
          git commit -m "fix: improve Gemini provider timeout and 503 resilience"
          git rm .github/workflows/repair-gemini-provider.yml Deployment/cloud/repair_gemini_provider.py Deployment/cloud/REPAIR_GEMINI
          git commit -m "chore: remove temporary Gemini repair tooling"
          git push
