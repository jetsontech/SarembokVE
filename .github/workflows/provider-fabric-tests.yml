name: Provider Fabric Tests

on:
  push:
    paths:
      - 'Deployment/cloud/provider_router.py'
      - 'Deployment/cloud/knowledge_rpc_server.py'
      - 'Deployment/cloud/runtime_authority.py'
      - 'Deployment/cloud/test_provider_router.py'
      - 'Deployment/cloud/compose.production.yaml'
  pull_request:
    paths:
      - 'Deployment/cloud/provider_router.py'
      - 'Deployment/cloud/knowledge_rpc_server.py'
      - 'Deployment/cloud/runtime_authority.py'
      - 'Deployment/cloud/test_provider_router.py'
      - 'Deployment/cloud/compose.production.yaml'

jobs:
  provider-fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile production runtime modules
        run: |
          python -m py_compile \
            Deployment/cloud/provider_router.py \
            Deployment/cloud/knowledge_rpc_server.py \
            Deployment/cloud/runtime_authority.py
      - name: Provider router contract tests
        env:
          PYTHONPATH: Deployment/cloud
        run: python -m unittest Deployment/cloud/test_provider_router.py -v
